<!doctype html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00713f" />

    <!--
      The defaults, which the SPA overrides per route once it boots (see
      `src/lib/seo.ts`). They are not placeholders: this is what a crawler that
      does not run JavaScript, and every social scraper, actually reads. Which
      is why they are complete rather than minimal.
    -->
    <title>Tài Liệu Sinh Viên — Kho tri thức & học tập cộng đồng</title>
    <meta
      name="description"
      content="Nền tảng chia sẻ ghi chép, tài liệu học tập và kết nối cộng đồng sinh viên phi lợi nhuận."
    />
    <link rel="canonical" href="https://tailieusinhvien.pages.dev/" />

    <!-- Absolute URLs are required: a relative og:image is ignored by every
         social crawler, so shared links would render without a preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tài Liệu Sinh Viên" />
    <meta property="og:url" content="https://tailieusinhvien.pages.dev/" />
    <meta property="og:title" content="Tài Liệu Sinh Viên — Kho tri thức & học tập cộng đồng" />
    <meta
      property="og:description"
      content="Chia sẻ • Khám phá • Tự học • Kết nối. Ghi chép, đề cương và tài liệu học tập dành cho cộng đồng sinh viên."
    />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:image" content="https://tailieusinhvien.pages.dev/og-image.png" />
    <meta property="og:image:secure_url" content="https://tailieusinhvien.pages.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tài Liệu Sinh Viên — Kho tri thức & học tập cộng đồng"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tài Liệu Sinh Viên — Kho tri thức & học tập cộng đồng" />
    <meta
      name="twitter:description"
      content="Ghi chép, đề cương và tài liệu học tập dành cho cộng đồng sinh viên."
    />
    <meta name="twitter:image" content="https://tailieusinhvien.pages.dev/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Structured data. `WebSite` with a SearchAction is what lets Google
         offer a search box for the site directly in results; without it the
         site is eligible for nothing but a plain blue link. The organization
         node is declared once here rather than per page, because it is the
         same entity on every page and repeating it invites contradictions. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tailieusinhvien.pages.dev/#website",
            "url": "https://tailieusinhvien.pages.dev/",
            "name": "Tài Liệu Sinh Viên",
            "alternateName": "Tai Lieu Sinh Vien",
            "description": "Kho tài liệu học thuật và cộng đồng tri thức mở dành cho sinh viên.",
            "inLanguage": "vi",
            "publisher": { "@id": "https://tailieusinhvien.pages.dev/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://tailieusinhvien.pages.dev/documents?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://tailieusinhvien.pages.dev/#organization",
            "name": "Cộng đồng Tài Liệu Sinh Viên",
            "alternateName": "Tai Lieu Sinh Vien Community",
            "url": "https://tailieusinhvien.pages.dev/",
            "logo": "https://tailieusinhvien.pages.dev/icon-512.png"
          }
        ]
      }
    </script>

    <!-- Vietnamese text needs a font with full diacritic coverage. System
         fonts are used rather than a webfont so the first paint is not blocked
         on a network request through the tunnel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
