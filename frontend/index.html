    <meta name="theme-color" content="#0f5132" />

    <title>TAILIEU TTN — Kho tri thức Đại học Tây Nguyên</title>
    <meta
      name="description"
      content="Nền tảng chia sẻ tài liệu học tập, đề thi, bài giảng và kết nối cộng đồng học thuật Đại học Tây Nguyên."

         by every social crawler, so shared links render without a preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TAILIEU TTN" />
    <meta property="og:title" content="TAILIEU TTN — Kho tri thức Đại học Tây Nguyên" />

      property="og:description"
      content="Chia sẻ • Khám phá • Học tập • Kết nối. Tài liệu, đề thi và bài giảng dành cho sinh viên Đại học Tây Nguyên."
    />
    <meta property="og:locale" content="vi_VN" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Vietnamese text needs a font with full diacritic coverage. System
         fonts are used rather than a webfont so the first paint is not blocked
         on a network request through the tunnel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
