<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tài liệu TTN">
  <!--
    The mark: a page with a turned corner, carrying a leaf.

    Two ideas, one glyph. The page is the product, a document library. The
    leaf is the place, Tây Nguyên, the Central Highlands, whose identity is
    green and growing.

    It is drawn as large flat shapes with no outline and no interior detail
    beyond the leaf, because the same file is the 16px tab icon. Measured at
    16px, a thinner page with a paler corner and a midrib collapsed into an
    indistinct gold smudge; the fold is now gold rather than pale green and
    the leaf fills the page, so three high-contrast flat areas survive the
    downsampling.

    Colours are the tokens the stylesheet defines (brand 600, gold 400),
    converted from OKLCH to hex because an SVG asset cannot resolve a CSS
    custom property.
  -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005f2e"/>
      <stop offset="1" stop-color="#007e46"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#badge)"/>

  <!-- The page, with the corner already turned: one path, no fold overlay. -->
  <path d="M19 10h18l11 11v31a4 4 0 0 1-4 4H19a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z" fill="#ffffff"/>
  <path d="M37 10l11 11H40a3 3 0 0 1-3-3z" fill="#e3ae28"/>

  <!-- The leaf, with a stem so it does not read as a droplet. -->
  <path d="M31 23c7 6 8.6 13.6 0 21-8.6-7.4-7-15 0-21z" fill="#e3ae28"/>
  <path d="M31 44v6" stroke="#e3ae28" stroke-width="2.6" stroke-linecap="round"/>
</svg>
